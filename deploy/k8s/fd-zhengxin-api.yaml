# fd-zhengxin-api — prod (fd-prod)
# 形制照 fd-zhesi/deploy/k8s 的 api 形态，但政心走服务化消费：
# 参照系经 MCP/REST 服务（fd-zhengxin-reference）而非镜像内置 seed 拷库（D3 修复后双面齐）。
# - image tag 等 CI 首次出片后替换（本仓不推镜像、不碰集群）；
# - env ← Secret fd-zhengxin-api-env（键名：FDZX__AUTH_* / FDZX__LLM_* / FDZX__INFOSTREAM_BASE_URL /
#   FDZX__GUARD_OVERLAY；库路径走 /data PVC）；
# - FDZX__REFERENCE_BASE_URL 指集群内参照系服务（下方 env 明写，非机密）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-zhengxin-api
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-zhengxin-api
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-zhengxin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-zhengxin-api
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: api
          image: ccr.ccs.tencentyun.com/finddata-business/fd-zhengxin-api:sha-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
          env:
            - name: FDZX__REFERENCE_BASE_URL
              value: http://fd-zhengxin-reference.fd-prod.svc.cluster.local:8000/mcp
            - name: FDZX__DB
              value: /data/personal.db
            - name: FDZX__PULSE_DB
              value: /data/pulse.db
            - name: FDZX__LEDGER_DB
              value: /data/ledger.db
          envFrom:
            - secretRef:
                name: fd-zhengxin-api-env
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fd-zhengxin-data
---
apiVersion: v1
kind: Service
metadata:
  name: fd-zhengxin-api
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-zhengxin-api
spec:
  selector:
    app.kubernetes.io/name: fd-zhengxin-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fd-zhengxin-data
  namespace: fd-prod
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
