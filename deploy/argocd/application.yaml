# ArgoCD Application — fd-zhengxin-web（cheap 集群 fd-prod）。
# 形制照 fd-zhesi：Application 放在同步路径（deploy/k8s）之外避免自引用；
# GitOps 只管工作负载清单；Secret 集群内手工创建不入 git。
# 骨架期占位：远端仓建立后生效（本仓 git 为本地仓，不设 remote、不 push）；
# 前置：argocd ns 已建 repo 凭据 secret（repo-fd-zhengxin-web）+ app secret
#（fd-zhengxin-web-env），否则首同步 ImagePullBackOff / CreateContainerConfigError。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-zhengxin-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitee.com/FindDataTechnology/fd-zhengxin-web.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
