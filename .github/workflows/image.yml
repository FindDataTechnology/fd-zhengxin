# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# fd-zhengxin 单仓双镜像：web（前端静态面）/ api（FastAPI 服务端）。形制照 fd-zhesi。
# 骨架期说明：远端仓未建（本地仓无 remote），workflow 待建仓接线后生效。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite
        working-directory: server
        run: python -m pytest tests/ -q

  fd-zhengxin-web:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-zhengxin-web
      namespace: finddata-business
      context: web
      dockerfile: web/Dockerfile

  fd-zhengxin-api:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-zhengxin-api
      namespace: finddata-business
      context: server
      dockerfile: server/Dockerfile
