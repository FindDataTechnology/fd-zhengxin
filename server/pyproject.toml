[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-zhengxin-api"
version = "0.1.0"
description = "政心（zhengxin）产品门面服务端：官网/工作台/管理后台 API。个人层（理解卡/学习地图/理解年轮）的自有存储在本服务；理解卡不含任何表态字段。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyjwt[crypto]>=2.8",
    "uvicorn",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
