[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-zhengxin-api"
version = "0.1.0"
description = "政心（zhengxin）产品门面服务端：官网/工作台/管理后台 API。个人层（理解卡/学习地图/理解年轮）的自有存储在本服务；理解卡不含任何表态字段。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyjwt[crypto]>=2.8",
    "uvicorn",
    "httpx>=0.27",
    # 文件上传（/loops/impact/file 的 multipart）：FastAPI 的 Form/File 需要它。
    # 不放 optional——端点就在主路由上，缺包会让整个 app 起不来（不是降级）。
    "python-multipart>=0.0.9",
    # PDF 正文抽取（用户上传的部委公告附件常常是 PDF）。
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
