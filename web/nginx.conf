server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点（不经缓存）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 工作台 API 反代：同源调 /api/，上游 fd-prod 集群内 fd-zhengxin-api
    # 注意：Service fd-zhengxin-api 只暴露 port 80（targetPort 才是容器 8000）。
    # 直连 svc 的 :8000 无转发规则、包被静默丢弃 → 表现为 /api/ 挂死而非报错
    # （2026-10-30 公网接入验收实测：:8000 超时 60s，:80 立即 401）。
    location /api/ {
        proxy_pass http://fd-zhengxin-api.fd-prod.svc.cluster.local:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退：/ /workbench /admin全部落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
